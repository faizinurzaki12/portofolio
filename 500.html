<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>500 - Kesalahan Server</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/loading.css" />
    <style>
      :root {
        --primary-color: #2c3e50;
        --bg-main: #ffffff;
        --text-main: #212529;
        --text-subtle: #495057;
        --text-light: #ffffff;
      }
      [data-theme="dark"], [data-bs-theme="dark"] {
        --primary-color: #1a252f;
        --bg-main: #121212;
        --text-main: #f7fafc;
        --text-subtle: #cbd5e0;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text-main);
        background-color: var(--bg-main);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        transition: background-color 0.3s, color 0.3s;
      }
      .btn-custom {
        background-color: var(--primary-color);
        color: var(--text-light);
        border: none;
      }
      .btn-custom:hover { 
        background-color: #1a252f; 
        color: var(--text-light); 
      }
      .error-code {
        font-size: clamp(5rem, 18vw, 10rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        color: #c0392b;
        opacity: 0.95;
      }
      [data-theme="dark"] .error-code,
      [data-bs-theme="dark"] .error-code { 
        color: #fc8181; 
      }
    </style>
  </head>
  <body>
    <div id="pageLoader" class="page-loader" aria-live="polite" aria-busy="true">
      <div class="page-loader-spinner" role="status" aria-label="Memuat halaman"></div>
    </div>

    <main class="w-100">
      <div class="container text-center py-5">
        <div class="error-code mb-2">500</div>
        <h1 class="fw-bold mb-3">Kesalahan Server</h1>
        <p class="lead custom-text-muted mb-4 mx-auto" style="max-width: 520px;">
          Maaf, terjadi kesalahan teknis di sisi server. Silakan muat ulang halaman atau coba lagi beberapa saat kemudian.
        </p>
        <div>
          <a href="index.html" class="btn btn-custom btn-lg px-4 me-2 mb-2">Kembali ke Beranda</a>
          <button type="button" class="btn btn-outline-secondary btn-lg px-4 mb-2" onclick="window.location.reload()">Muat Ulang</button>
        </div>
      </div>
    </main>

    <script src="assets/js/loading.js"></script>
    <script>
      if (window.PageLoading && typeof PageLoading.pageReady === 'function') {
        PageLoading.pageReady();
      }

      // Deteksi otomatis mode tema sistem/tersimpan
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initialTheme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', initialTheme);
      document.documentElement.setAttribute('data-bs-theme', initialTheme);
    </script>
  </body>
</html>
