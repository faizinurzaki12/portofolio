<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>404 - Halaman Tidak Ditemukan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/loading.css" />
    <style>
      :root {
        --primary-color: #2c3e50;
        --secondary-color: #7f8c8d;
        --bg-main: #ffffff;
        --bg-card: #ffffff;
        --text-main: #212529;
        --text-subtle: #495057;
        --text-link: #0d6efd;
        --text-light: #ffffff;
        --border-color: #e2e8f0;
      }
      [data-theme="dark"],
      [data-bs-theme="dark"] {
        --primary-color: #1a252f;
        --secondary-color: #a0aec0;
        --bg-main: #121212;
        --bg-card: #1e1e1e;
        --text-main: #f7fafc;
        --text-subtle: #cbd5e0;
        --text-link: #63b3ed;
        --border-color: #2d3748;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text-main);
        background-color: var(--bg-main);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        transition:
          background-color 0.3s,
          color 0.3s;
      }
      main {
        flex: 1;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        color: var(--text-main) !important;
      }
      .custom-text-muted {
        color: var(--text-subtle) !important;
      }
      .navbar-custom {
        background-color: var(--primary-color);
        transition: background-color 0.3s;
      }
      .navbar-custom .nav-link {
        color: rgba(255, 255, 255, 0.85);
      }
      .navbar-custom .nav-link.active,
      .navbar-custom .nav-link:hover {
        color: var(--text-light);
      }
      .btn-custom {
        background-color: var(--primary-color);
        color: var(--text-light);
        border: none;
      }
      .btn-custom:hover {
        background-color: #1a252f;
        color: var(--text-light);
      }
      .theme-toggle-btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: var(--text-light);
        padding: 4px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      .theme-toggle-btn:hover {
        background-color: rgba(255, 255, 255, 0.2);
      }
      footer {
        background-color: var(--primary-color);
        color: rgba(255, 255, 255, 0.7);
        padding: 20px 0;
        margin-top: auto;
        transition: background-color 0.3s;
      }
      .error-code {
        font-size: clamp(4rem, 15vw, 8rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--primary-color);
        opacity: 0.9;
      }
      [data-theme="dark"] .error-code,
      [data-bs-theme="dark"] .error-code {
        color: #63b3ed;
      }
    </style>
  </head>
  <body>
    <div id="pageLoader" class="page-loader" aria-live="polite" aria-busy="true">
      <div class="page-loader-spinner" role="status" aria-label="Memuat halaman"></div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-custom navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">MyPortfolio</a>
        <div class="d-flex align-items-center order-lg-last ms-auto ms-lg-3">
          <button class="theme-toggle-btn me-2" id="themeToggleBtn" aria-label="Mode Gelap">
            <span id="themeIcon">☾</span>
          </button>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Buka menu navigasi">
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
            <li class="nav-item"><a class="nav-link" href="project.html">Project</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">Tentang</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Kontak</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="py-5">
      <div class="container text-center py-5">
        <div class="error-code mb-2">404</div>
        <h1 class="fw-bold mb-3">Halaman Tidak Ditemukan</h1>
        <p class="lead custom-text-muted mb-4 mx-auto" style="max-width: 480px">Maaf, halaman yang Anda cari tidak tersedia atau sudah dipindahkan.</p>
        <a href="index.html" class="btn btn-custom btn-lg px-4 me-2">Kembali ke Beranda</a>
        <a href="contact.html" class="btn btn-outline-secondary btn-lg px-4">Hubungi Saya</a>
      </div>
    </main>

    <footer class="text-center">
      <div class="container">
        <p class="mb-0">&copy; 2026 MyPortfolio. Semua Hak Dilindungi.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/loading.js"></script>
    <script>
      if (window.PageLoading && typeof PageLoading.pageReady === "function") {
        PageLoading.pageReady();
      }
    </script>
    <script>
      const toggleBtn = document.getElementById("themeToggleBtn");
      const themeIcon = document.getElementById("themeIcon");
      const savedTheme = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.setAttribute("data-bs-theme", theme);
        if (theme === "dark") {
          themeIcon.textContent = "☀";
          toggleBtn.setAttribute("aria-label", "Mode Terang");
        } else {
          themeIcon.textContent = "☾";
          toggleBtn.setAttribute("aria-label", "Mode Gelap");
        }
      }

      var initialTheme = savedTheme || (prefersDark ? "dark" : "light");
      applyTheme(initialTheme);

      toggleBtn.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        applyTheme(newTheme);
        localStorage.setItem("theme", newTheme);
      });
    </script>
  </body>
</html>
