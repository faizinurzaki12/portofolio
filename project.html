<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project - Portofolio Saya</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/loading.css" />

    <style>
      /* SKEMA WARNA TERANG (DEFAULT) */
      :root {
        --primary-color: #2c3e50;
        --secondary-color: #7f8c8d;
        --bg-main: #ffffff;
        --bg-card: #ffffff;
        --text-main: #212529;
        --text-subtle: #495057;
        --text-light: #ffffff;
        --border-color: #e2e8f0;
        --card-thumb-bg: #4a5568;
      }

      /* SKEMA WARNA GELAP (DARK MODE) */
      [data-theme="dark"] {
        --primary-color: #1a252f;
        --secondary-color: #a0aec0;
        --bg-main: #121212;
        --bg-card: #1e1e1e;
        --text-main: #f7fafc;
        --text-subtle: #cbd5e0;
        --border-color: #2d3748;
        --card-thumb-bg: #2d3748;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text-main);
        background-color: var(--bg-main);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        transition:
          background-color 0.3s,
          color 0.3s;
      }

      main {
        flex: 1;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      .card-title {
        color: var(--text-main) !important;
      }

      .custom-text-muted {
        color: var(--text-subtle) !important;
      }

      .navbar-custom {
        background-color: var(--primary-color);
        transition: background-color 0.3s;
      }
      .navbar-custom .nav-link {
        color: rgba(255, 255, 255, 0.85);
      }
      .navbar-custom .nav-link.active,
      .navbar-custom .nav-link:hover {
        color: var(--text-light);
      }

      /* CARD ADJUSTMENT */
      .card-project {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          background-color 0.3s,
          border-color 0.3s;
        height: 100%;
      }
      .card-project:hover {
        transform: translateY(-5px);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }
      .card-thumbnail {
        background-color: var(--card-thumb-bg);
        height: 200px;
        position: relative;
        overflow: hidden;
      }
      .card-thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .tech-badge-public {
        display: inline-block;
        font-size: 0.72rem;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        background: var(--border-color);
        color: var(--text-subtle);
        margin: 0 0.25rem 0.25rem 0;
      }

      .theme-toggle-btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: var(--text-light);
        padding: 4px 10px;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .theme-toggle-btn:hover {
        background-color: rgba(255, 255, 255, 0.2);
      }

      footer {
        background-color: var(--primary-color);
        color: rgba(255, 255, 255, 0.7);
        padding: 20px 0;
        margin-top: auto;
        transition: background-color 0.3s;
      }
    </style>
  </head>
  <body>
    <!-- Page Loading Spinner -->
    <div id="pageLoader" class="page-loader" aria-live="polite" aria-busy="true">
      <div class="page-loader-spinner" role="status" aria-label="Memuat halaman"></div>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-custom navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">MyPortfolio</a>

        <div class="d-flex align-items-center order-lg-last ms-auto ms-lg-3">
          <button class="theme-toggle-btn me-2" id="themeToggleBtn" aria-label="Mode Gelap">
            <span id="themeIcon">☾</span>
          </button>

          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Buka menu navigasi">
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
            <li class="nav-item"><a class="nav-link active" href="project.html">Project</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">Tentang</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Kontak</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- DAFTAR PROJECT -->
    <main class="py-5">
      <div class="container">
        <h1 class="fw-bold mb-4">Semua Project</h1>
        <p class="custom-text-muted mb-5">Berikut adalah beberapa proyek atau pekerjaan yang telah saya selesaikan baru-baru ini.</p>

        <!-- Skeleton loader -->
        <div id="projectListSkeleton" class="skeleton-wrap row g-4">
          <div class="col-md-6 col-lg-4">
            <div class="skeleton-card">
              <div class="skeleton skeleton-thumb"></div>
              <div class="p-3">
                <div class="skeleton skeleton-text md"></div>
                <div class="skeleton skeleton-text full"></div>
                <div class="skeleton skeleton-text sm"></div>
                <div class="mt-2"><span class="skeleton skeleton-badge"></span><span class="skeleton skeleton-badge"></span></div>
              </div>
            </div>
          </div>
          <div class="col-md-6 col-lg-4">
            <div class="skeleton-card">
              <div class="skeleton skeleton-thumb"></div>
              <div class="p-3">
                <div class="skeleton skeleton-text md"></div>
                <div class="skeleton skeleton-text full"></div>
                <div class="skeleton skeleton-text sm"></div>
                <div class="mt-2"><span class="skeleton skeleton-badge"></span><span class="skeleton skeleton-badge"></span></div>
              </div>
            </div>
          </div>
          <div class="col-md-6 col-lg-4">
            <div class="skeleton-card">
              <div class="skeleton skeleton-thumb"></div>
              <div class="p-3">
                <div class="skeleton skeleton-text md"></div>
                <div class="skeleton skeleton-text full"></div>
                <div class="skeleton skeleton-text sm"></div>
                <div class="mt-2"><span class="skeleton skeleton-badge"></span><span class="skeleton skeleton-badge"></span></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Row Kontainer Card Project -->
        <div class="row g-4" id="projectListRow"></div>

        <!-- Container Navigasi Pagination -->
        <div class="d-flex justify-content-center align-items-center gap-2 mt-5" id="pagination-container"></div>

        <p class="text-center custom-text-muted py-5 d-none" id="projectListEmpty">Belum ada project yang ditambahkan. Silakan tambahkan lewat panel admin.</p>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center">
      <div class="container">
        <p class="mb-0">&copy; 2026 MyPortfolio. Semua Hak Dilindungi.</p>
      </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Supabase JS SDK & Store JS Integration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/loading.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const projectsContainer = document.querySelector("#projectListRow");
        const skeletonLoader = document.querySelector("#projectListSkeleton");
        const emptyMessage = document.querySelector("#projectListEmpty");
        const paginationContainer = document.querySelector("#pagination-container");

        if (!projectsContainer) return;

        const ITEMS_PER_PAGE = 10;
        let currentPage = 1;
        let allProjects = [];

        try {
          allProjects = await Store.getProjects();

          if (skeletonLoader) skeletonLoader.style.display = "none";

          if (!allProjects || allProjects.length === 0) {
            if (emptyMessage) emptyMessage.classList.remove("d-none");
            if (paginationContainer) paginationContainer.innerHTML = "";
            return;
          }

          renderProjectsPage(currentPage);
        } catch (error) {
          console.error("Gagal memuat daftar proyek:", error);
          if (skeletonLoader) skeletonLoader.style.display = "none";
          projectsContainer.innerHTML = '<div class="col-12 text-center text-danger py-4"><p>Gagal memuat data proyek.</p></div>';
        }

        function renderProjectsPage(page) {
          currentPage = page;
          projectsContainer.innerHTML = "";

          const startIndex = (page - 1) * ITEMS_PER_PAGE;
          const endIndex = startIndex + ITEMS_PER_PAGE;
          const paginatedProjects = allProjects.slice(startIndex, endIndex);

          paginatedProjects.forEach((project) => {
            const rawTags = project.tags || project.technologies || [];
            const tagsArray = Array.isArray(rawTags) ? rawTags : String(rawTags).split(",");
            const tagsHtml = tagsArray
              .filter((t) => t.trim() !== "")
              .map((tag) => `<span class="tech-badge-public">${tag.trim()}</span>`)
              .join("");

            const projectImage = project.image || project.image_url || "https://via.placeholder.com/600x400?text=No+Image";
            const detailUrl = `project-detail-p.html?id=${project.id}`;

            const projectCard = `
              <div class="col-md-6 col-lg-4">
                <div class="card card-project rounded-3 overflow-hidden flex-column">
                  <div class="card-thumbnail">
                    <a href="${detailUrl}">
                      <img src="${projectImage}" alt="${project.title || "Project"}" class="img-fluid">
                    </a>
                    ${project.featured ? '<span class="badge bg-warning text-dark position-absolute top-0 end-0 m-2 fw-bold">Featured</span>' : ""}
                  </div>
                  
                  <div class="card-body p-4 d-flex flex-column justify-between">
                    <div>
                      <h3 class="h5 card-title fw-bold mb-2">
                        <a href="${detailUrl}" class="text-decoration-none text-reset">${project.title || "Tanpa Judul"}</a>
                      </h3>
                      <p class="custom-text-muted small mb-3 text-truncate-3">${project.description || ""}</p>
                      
                      <div class="mb-3">
                        ${tagsHtml}
                      </div>
                    </div>

                    <div class="pt-3 border-top d-flex align-items-center justify-content-between small mt-auto">
                      <a href="${detailUrl}" class="btn btn-sm btn-outline-primary">Detail &rarr;</a>
                      <div class="d-flex gap-2">
                        ${project.demo_url || project.link ? `<a href="${project.demo_url || project.link}" target="_blank" rel="noopener noreferrer" class="text-decoration-none fw-semibold">Demo</a>` : ""}
                        ${project.repo_url || project.github_url ? `<a href="${project.repo_url || project.github_url}" target="_blank" rel="noopener noreferrer" class="custom-text-muted text-decoration-none">GitHub</a>` : ""}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            `;

            projectsContainer.insertAdjacentHTML("beforeend", projectCard);
          });

          renderPaginationControls();
        }

        function renderPaginationControls() {
          if (!paginationContainer) return;

          const totalPages = Math.ceil(allProjects.length / ITEMS_PER_PAGE);

          if (totalPages <= 1) {
            paginationContainer.innerHTML = "";
            return;
          }

          let paginationHtml = "";

          paginationHtml += `
            <button 
              class="btn btn-sm ${currentPage === 1 ? "btn-outline-secondary disabled" : "btn-outline-primary"}"
              ${currentPage === 1 ? "disabled" : ""}
              data-page="${currentPage - 1}">
              &laquo; Prev
            </button>
          `;

          for (let i = 1; i <= totalPages; i++) {
            paginationHtml += `
              <button 
                class="btn btn-sm ${i === currentPage ? "btn-primary" : "btn-outline-primary"}"
                data-page="${i}">
                ${i}
              </button>
            `;
          }

          paginationHtml += `
            <button 
              class="btn btn-sm ${currentPage === totalPages ? "btn-outline-secondary disabled" : "btn-outline-primary"}"
              ${currentPage === totalPages ? "disabled" : ""}
              data-page="${currentPage + 1}">
              Next &raquo;
            </button>
          `;

          paginationContainer.innerHTML = paginationHtml;

          paginationContainer.querySelectorAll("button[data-page]").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              const targetPage = parseInt(e.currentTarget.getAttribute("data-page"));
              if (targetPage && targetPage !== currentPage && targetPage >= 1 && targetPage <= totalPages) {
                renderProjectsPage(targetPage);
                window.scrollTo({ top: projectsContainer.offsetTop - 100, behavior: "smooth" });
              }
            });
          });
        }
      });
    </script>

    <!-- SCRIPT DARK MODE -->
    <script>
      const toggleBtn = document.getElementById("themeToggleBtn");
      const themeIcon = document.getElementById("themeIcon");

      const savedTheme = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

      if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
        document.documentElement.setAttribute("data-theme", "dark");
        if (themeIcon) themeIcon.textContent = "☀";
        if (toggleBtn) toggleBtn.setAttribute("aria-label", "Mode Terang");
      }

      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          const currentTheme = document.documentElement.getAttribute("data-theme");
          let newTheme = "light";

          if (currentTheme !== "dark") {
            newTheme = "dark";
            if (themeIcon) themeIcon.textContent = "☀";
            toggleBtn.setAttribute("aria-label", "Mode Terang");
          } else {
            if (themeIcon) themeIcon.textContent = "☾";
            toggleBtn.setAttribute("aria-label", "Mode Gelap");
          }

          document.documentElement.setAttribute("data-theme", newTheme);
          localStorage.setItem("theme", newTheme);
        });
      }
    </script>
  </body>
</html>
